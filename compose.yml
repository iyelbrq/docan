x-app-environment: &app-environment
    APP_NAME: "${APP_NAME:-Docan}"
    APP_ENV: "${APP_ENV:-production}"
    APP_DEBUG: "${APP_DEBUG:-false}"
    APP_URL: "${APP_URL:-http://localhost:8080}"
    PUBLIC_APP_URL: "${PUBLIC_APP_URL:-https://docan.suhail.my.id}"
    APP_KEY: "${APP_KEY:-}"
    APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Jakarta}"
    APP_LOCALE: "${APP_LOCALE:-id}"
    APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-id}"

    LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
    LOG_LEVEL: "${LOG_LEVEL:-warning}"

    MAIL_MAILER: "${MAIL_MAILER:-log}"
    MAIL_SCHEME: "${MAIL_SCHEME:-}"
    MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
    MAIL_PORT: "${MAIL_PORT:-587}"
    MAIL_USERNAME: "${MAIL_USERNAME:-}"
    MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@docan.local}"
    MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Docan}"

    DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
    DB_HOST: "${DB_HOST:-host.docker.internal}"
    DB_PORT: "${DB_PORT:-5432}"
    DB_DATABASE: "${DB_DATABASE:-sakukasir}"
    DB_USERNAME: "${DB_USERNAME:-sakukasir}"
    DB_PASSWORD: "${DB_PASSWORD:-docan-local-password}"
    DB_SSLMODE: "${DB_SSLMODE:-disable}"

    SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
    SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"

    CACHE_STORE: "${CACHE_STORE:-redis}"
    QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"

    REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
    REDIS_HOST: "${REDIS_HOST:-redis}"
    REDIS_PORT: "${REDIS_PORT:-6379}"
    REDIS_DB: "${REDIS_DB:-0}"
    REDIS_CACHE_DB: "${REDIS_CACHE_DB:-1}"
    REDIS_QUEUE_CONNECTION: "${REDIS_QUEUE_CONNECTION:-default}"

    SEED_DATABASE: "${SEED_DATABASE:-false}"
    RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    OPTIMIZE_APP: "${OPTIMIZE_APP:-true}"

x-app-base: &app-base
    build:
        context: .
    image: "docan-app:${DOCAN_VERSION:-latest}"
    restart: unless-stopped

    environment:
        <<: *app-environment

    volumes:
        - app_storage:/app/storage

    depends_on:
        redis:
            condition: service_healthy

    # Database dijalankan di luar compose ini (lihat DB_HOST pada .env).
    # host.docker.internal menunjuk ke host tempat PostgreSQL tersebut listen.
    extra_hosts:
        - "host.docker.internal:host-gateway"

    security_opt:
        - no-new-privileges:true

services:
    gateway:
        image: caddy:2.10-alpine
        restart: unless-stopped

        ports:
            - "${APP_PORT:-8080}:80"

        volumes:
            - ./docker/Gateway.Caddyfile:/etc/caddy/Caddyfile:ro

        depends_on:
            app:
                condition: service_healthy

        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost/up"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s

        security_opt:
            - no-new-privileges:true

    app:
        <<: *app-base

        deploy:
            replicas: ${APP_REPLICAS:-1}
            resources:
                limits:
                    memory: "${APP_MEMORY_LIMIT:-768M}"

        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost/ready"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 60s

    queue:
        <<: *app-base

        environment:
            <<: *app-environment
            RUN_MIGRATIONS: "false"
            SEED_DATABASE: "false"
            OPTIMIZE_APP: "false"

        command:
            - php
            - artisan
            - queue:work
            - redis
            - --sleep=1
            - --tries=3
            - --timeout=120
            - --max-time=3600

        healthcheck:
            test: ["CMD-SHELL", "kill -0 1"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 15s

        deploy:
            replicas: ${QUEUE_REPLICAS:-1}
            resources:
                limits:
                    memory: "${QUEUE_MEMORY_LIMIT:-512M}"

    scheduler:
        <<: *app-base

        environment:
            <<: *app-environment
            RUN_MIGRATIONS: "false"
            SEED_DATABASE: "false"
            OPTIMIZE_APP: "false"

        command:
            - php
            - artisan
            - schedule:work

        healthcheck:
            test: ["CMD-SHELL", "kill -0 1"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 15s

        deploy:
            resources:
                limits:
                    memory: "${SCHEDULER_MEMORY_LIMIT:-256M}"

    redis:
        image: redis:7.4-alpine
        restart: unless-stopped

        command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory-policy
            - noeviction

        volumes:
            - redis_data:/data

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 15
            start_period: 5s

        security_opt:
            - no-new-privileges:true

    loadtest:
        image: grafana/k6:0.57.0

        profiles:
            - tools

        volumes:
            - ./tests/load:/scripts:ro

        environment:
            BASE_URL: http://gateway
            LOGIN_ID: "${LOADTEST_LOGIN_ID:-SDM-001}"
            PASSWORD: "${LOADTEST_PASSWORD:-password}"
            VUS: "${LOADTEST_VUS:-100}"
            DURATION: "${LOADTEST_DURATION:-3m}"
            RAMP_DURATION: "${LOADTEST_RAMP_DURATION:-30s}"

        command:
            - run
            - /scripts/k6-read-flow.js

        depends_on:
            gateway:
                condition: service_healthy

volumes:
    app_storage:
        name: "${APP_STORAGE_VOLUME_NAME:-docan_app_storage}"

    redis_data:
        name: "${REDIS_VOLUME_NAME:-docan_redis_data}"
